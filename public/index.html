<style>
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    color: var(--text);
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-low) 62%, var(--sky-top) 100%) fixed;
    font: 18px/1.6 var(--body);
  }

  .hero {
    position: relative;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr);
    align-items: center;
    gap: 2rem;
    max-width: 76rem;
    margin: 0 auto;
    padding: 4rem 1.5rem 2rem;
  }
  .intro { position: relative; z-index: 1; }
  h1 {
    font-family: var(--display);
    font-variation-settings: "opsz" 96;
    font-weight: 800;
    font-size: clamp(5rem, 13vw, 11rem);
    line-height: .86;
    letter-spacing: -.045em;
    margin: 0 0 1.5rem;
  }
  .bio {
    font-size: clamp(1.15rem, 1.6vw, 1.4rem);
    line-height: 1.45;
    color: var(--muted);
    margin: 0 0 2rem;
    max-width: 24ch;
  }
  .stage {
    position: relative;
    aspect-ratio: 1 / 1;
    width: 100%;
  }
  .stage::before {
    content: "";
    position: absolute;
    inset: 18% 10% 8%;
    background: radial-gradient(closest-side, var(--glow), transparent);
    filter: blur(8px);
  }
  #scene {
    position: relative;
    width: 100%;
    height: 100%;
    display: block;
    opacity: 0;
    transition: opacity .6s ease;
  }
  #scene.ready { opacity: 1; }
  /* One switch for every animation on the page; the room, the video and the song bars obey it. */
  .motion {
    position: absolute;
    right: .75rem;
    bottom: .75rem;
    z-index: 2;
    display: grid;
    place-items: center;
    width: 2.25rem;
    height: 2.25rem;
    padding: 0;
    border: 1px solid var(--line);
    border-radius: 50%;
    color: var(--muted);
    background: color-mix(in srgb, var(--sky-low) 80%, transparent);
    cursor: pointer;
  }
  .motion:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .motion svg { width: .9rem; height: .9rem; fill: currentColor; }
  .motion .play, [data-motion="off"] .motion .pause { display: none; }
  [data-motion="off"] .motion .play { display: block; }
  .fallback {
    display: none;
    position: relative;
    width: 100%;
    height: auto;
    border-radius: 14px;
    margin-top: 20%;
  }
  .no-webgl #scene { display: none; }
  .no-webgl .fallback { display: block; }

  main {
    max-width: 76rem;
    margin: 0 auto;
    padding: 0 1.5rem 6rem;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr);
    gap: 2rem;
  }
  .projects { grid-column: 1 / -1; }
  .cards { list-style: none; margin: 0; padding: 0; display: grid; gap: 1.25rem; }
  /* A project is its words beside a picture of it, the picture as wide as the room above. */
  .card {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr);
    gap: 2rem;
    align-items: center;
    padding: 1.5rem;
    border: 1px solid var(--line);
    border-radius: 22px;
    background: color-mix(in srgb, var(--sky-low) 70%, transparent);
  }
  .card p { margin: 0 0 .75rem; color: var(--muted); max-width: 32ch; }
  .card .more { margin: 0; font-size: 1rem; }
  /* The office plays in a terminal window, the way it runs. */
  .window {
    margin: 0;
    border-radius: 14px;
    overflow: hidden;
    background: #1b1a2b;
    box-shadow: 0 22px 44px -24px rgba(23, 22, 43, .55);
  }
  .window .bar { display: flex; align-items: center; gap: 6px; padding: 9px 12px; background: #262438; }
  .window .bar i { width: 10px; height: 10px; border-radius: 50%; background: #4b4866; }
  .window .bar span { margin-left: 8px; font: 500 12px/1 var(--mono); color: #a9a6c4; }
  .window video { display: block; width: 100%; height: auto; image-rendering: pixelated; }
  .install {
    display: inline-flex;
    align-items: center;
    gap: .75rem;
    margin: .5rem 0 1.25rem;
    padding: .4rem .45rem .4rem .9rem;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: color-mix(in srgb, var(--sky-top) 60%, transparent);
  }
  .install code { font: 500 .95rem/1.4 var(--mono); white-space: nowrap; }
  .install code::before { content: "$ "; color: var(--muted); }
  .install button {
    font: 500 .85rem/1 var(--body);
    color: var(--text);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: .45rem .65rem;
    cursor: pointer;
  }
  .install button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* The dotted line a link draws into the room; scene.js places it. */
  .leader { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; opacity: 0; z-index: 3; }
  .leader path { fill: none; stroke: var(--accent); stroke-width: 2; stroke-dasharray: 0 7; stroke-linecap: round; }
  /* A ring of page colour under each dot keeps the line readable over the room's darker things. */
  .leader .under { stroke: var(--sky-low); stroke-width: 5.5; }
  .leader circle { fill: var(--accent); }
  .leader .halo { opacity: .22; }
  h2 {
    font-family: var(--display);
    font-weight: 600;
    font-size: 1.05rem;
    letter-spacing: -.01em;
    color: var(--muted);
    margin: 0 0 1rem;
    padding-bottom: .75rem;
    border-bottom: 1px solid var(--line);
  }
  h3 {
    font-family: var(--display);
    font-variation-settings: "opsz" 48;
    font-weight: 700;
    font-size: 2rem;
    letter-spacing: -.03em;
    line-height: 1.1;
    margin: 0 0 .5rem;
  }
  .social { display: flex; flex-wrap: wrap; gap: .75rem; margin: 0; padding: 0; list-style: none; }
  .social a {
    display: inline-flex;
    align-items: center;
    gap: .55rem;
    padding: .5rem 1.05rem .5rem .85rem;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: color-mix(in srgb, var(--sky-low) 65%, transparent);
    font-size: 1rem;
    font-weight: 500;
    text-decoration: none;
    transition: border-color .15s ease, color .15s ease;
  }
  .listening { display: flex; align-items: center; gap: .6rem; margin: 1.1rem 0 0; font-size: .95rem; color: var(--muted); }
  .listening[hidden] { display: none; }
  .listening .track { color: var(--text); }
  /* Three bars that dance while a song is actually playing. */
  .eq { display: inline-flex; align-items: flex-end; gap: 2px; height: .8rem; flex: none; }
  .eq i { width: 3px; height: 40%; border-radius: 1px; background: var(--accent); }
  [data-motion="on"] .listening.live .eq i { animation: eq .9s ease-in-out infinite alternate; }
  .listening.live .eq i:nth-child(2) { animation-delay: -.3s; }
  .listening.live .eq i:nth-child(3) { animation-delay: -.6s; }
  @keyframes eq { to { height: 100%; } }
  .social svg {
    width: 1.1rem;
    height: 1.1rem;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  a {
    color: var(--text);
    text-decoration-line: underline;
    text-decoration-color: var(--accent);
    text-decoration-thickness: 2px;
    text-underline-offset: 5px;
    transition: text-decoration-thickness .15s ease, color .15s ease;
  }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 2px; }
  .social a:focus-visible { border-radius: 999px; }
  /* A tap leaves :hover set on touch screens, so hover styles only exist where a pointer hovers. */
  @media (hover: hover) {
    a:hover { color: var(--accent); text-decoration-thickness: 3px; }
    .social a:hover, .install button:hover { border-color: var(--accent); }
    .card:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
  }
  h3 a { text-decoration: none; }

  @media (max-width: 760px) {
    .hero { grid-template-columns: 1fr; padding-block: 2.5rem; gap: 0; }
    .stage { order: -1; max-width: 30rem; justify-self: center; }
    main { grid-template-columns: 1fr; }
    .bio { max-width: none; }
    .card { grid-template-columns: minmax(0, 1fr); gap: 1.25rem; }
    .install code { font-size: .85rem; }
    .card .window { order: -1; }
  }
  @media (prefers-reduced-motion: reduce) {
    #scene { transition: none; }
    a { transition: none; }
  }
</style>
</head>
