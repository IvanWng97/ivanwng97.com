<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ivan</title>
<meta name="description" content="Mobile dev. Building small things in my spare time.">
<meta property="og:title" content="Ivan">
<meta property="og:description" content="Mobile dev. Building small things in my spare time.">
<meta property="og:url" content="https://ivanwng97.com/">
<meta property="og:image" content="https://avatars.githubusercontent.com/u/39482599?v=4&s=400">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#eef1f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1b26" media="(prefers-color-scheme: dark)">
<link rel="canonical" href="https://ivanwng97.com/">
<link rel="icon" href="https://avatars.githubusercontent.com/u/39482599?v=4&s=64">
<link rel="preload" href="/fonts/fusion-pixel-8px.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* pixtuoid's own office face, OFL-1.1: /fonts/OFL-Fusion-Pixel.txt */
  @font-face {
    font-family: "Fusion Pixel 8px";
    src: url("/fonts/fusion-pixel-8px.woff2") format("woff2");
    font-display: swap;
  }

  /* The office by day, and at night under its sign (Tokyo Night, the sign's own palette). */
  :root {
    --bg: #eef1f8;
    --text: #1f2335;
    --muted: #4a5072;
    --link: #2b52c4;
    --cat: #9a5524;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1b26;
      --text: #c0caf5;
      --muted: #9aa5ce;
      --link: #7aa2f7;
      --cat: #ed9a50;
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 18px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  }
  main {
    max-width: 38rem;
    margin: 0 auto;
    padding: 4.5rem 1rem 4rem;
  }

  /* Pixel text only at whole multiples of the face's 8 px grid. */
  .px {
    font-family: "Fusion Pixel 8px", ui-monospace, monospace;
    font-weight: 400;
    -webkit-font-smoothing: none;
    letter-spacing: 0;
  }

  h1 { margin: 0; line-height: 0; }
  .sign {
    display: block;
    width: 100%;
    max-width: 432px;
    height: auto;
    image-rendering: pixelated;
    /* The sign's frame starts 8 of its 216 units in: line it up with the text. */
    margin-left: calc(min(100%, 432px) * -8 / 216);
  }
  .bio {
    margin: 1.25rem 0 0;
    font-size: 1.25rem;
    line-height: 1.5;
  }

  section { margin-top: 3.5rem; }
  h2 {
    font-size: 16px;
    line-height: 24px;
    margin: 0 0 1rem;
  }
  h3 {
    font-size: 24px;
    line-height: 32px;
    margin: 0 0 .25rem;
  }
  .work p { margin: 0; color: var(--muted); }
  .work .source { margin-top: .5rem; font-size: 1rem; }

  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: flex;
    align-items: baseline;
    gap: .75rem;
    padding: .25rem 0;
  }
  li::before {
    content: "";
    flex: none;
    width: 8px;
    height: 8px;
    background: var(--cat);
    transform: translateY(-2px);
  }
  .handle { color: var(--muted); }

  a {
    color: var(--link);
    text-decoration-thickness: 2px;
    text-underline-offset: 4px;
  }
  /* A pixel cursor's selection: the link fills, no easing. */
  a:hover {
    background: var(--link);
    color: var(--bg);
    text-decoration: none;
  }
  a:focus-visible {
    outline: 2px solid var(--link);
    outline-offset: 3px;
  }
  h3 a { text-decoration: none; }
  h3 a:hover { text-decoration: none; }
</style>
</head>
<body>
<main>
  <header>
    <h1><img class="sign" src="/sign.svg" width="432" height="252" alt="Ivan"></h1>
    <p class="bio">Mobile dev. Building small things in my spare time.</p>
  </header>

  <section aria-labelledby="made">
    <h2 id="made" class="px">Things I've made</h2>
    <article class="work">
      <h3 class="px"><a href="https://pixtuoid.dev">pixtuoid</a></h3>
      <p>Your AI coding agents, visualized as pixel-art coworkers in a terminal office.</p>
      <p class="source"><a href="https://github.com/pixtuoid/pixtuoid">Source on GitHub</a></p>
    </article>
  </section>

  <section aria-labelledby="elsewhere">
    <h2 id="elsewhere" class="px">Elsewhere</h2>
    <ul>
      <li><a href="https://github.com/IvanWng97">GitHub</a><span class="handle">@IvanWng97</span></li>
    </ul>
  </section>
</main>
</body>
</html>
