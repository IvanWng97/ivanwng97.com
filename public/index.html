<style>
  /* Dusk outside an office window; by day, the same room in morning light. */
  :root {
    --sky-top: #e9e6fb;
    --sky-low: #f6f4fb;
    --text: #17162b;
    --muted: #4a4866;
    --accent: #5b3fd1;
    --glow: rgba(120, 96, 255, .18);
    --line: rgba(23, 22, 43, .12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --sky-top: #0d0b20;
      --sky-low: #1a1c45;
      --text: #f3f0ea;
      --muted: #b9b6cf;
      --accent: #ffcf8a;
      --glow: rgba(255, 190, 120, .16);
      --line: rgba(243, 240, 234, .12);
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    color: var(--text);
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-low) 62%, var(--sky-top) 100%) fixed;
    font: 18px/1.6 Geist, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  .hero {
    position: relative;
    min-height: min(80vh, 760px);
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr);
    align-items: center;
    gap: 2rem;
    max-width: 76rem;
    margin: 0 auto;
    padding: 4rem 1.5rem 0;
  }
  .intro { position: relative; z-index: 1; }
  h1 {
    font-family: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
    font-variation-settings: "opsz" 96;
    font-weight: 800;
    font-size: clamp(5rem, 13vw, 11rem);
    line-height: .86;
    letter-spacing: -.045em;
    margin: 0 0 1.5rem;
  }
  .bio {
    font-size: clamp(1.15rem, 1.6vw, 1.4rem);
    line-height: 1.45;
    color: var(--muted);
    margin: 0 0 2rem;
    max-width: 24ch;
  }
  .stage {
    position: relative;
    aspect-ratio: 1 / 1;
    width: 100%;
  }
  .stage::before {
    content: "";
    position: absolute;
    inset: 18% 10% 8%;
    background: radial-gradient(closest-side, var(--glow), transparent);
    filter: blur(8px);
  }
  #scene {
    position: relative;
    width: 100%;
    height: 100%;
    display: block;
    opacity: 0;
    transition: opacity .6s ease;
  }
  #scene.ready { opacity: 1; }
  .fallback {
    display: none;
    position: relative;
    width: 100%;
    height: auto;
    border-radius: 14px;
    margin-top: 20%;
  }
  .no-webgl #scene { display: none; }
  .no-webgl .fallback { display: block; }

  main {
    max-width: 76rem;
    margin: 0 auto;
    padding: 0 1.5rem 6rem;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr);
    gap: 2rem;
  }
  .projects { grid-column: 1 / -1; }
  .cards {
    list-style: none; margin: 0; padding: 0;
    display: grid; gap: 1.25rem;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 20rem), 1fr));
  }
  .card {
    padding: 1.5rem;
    border: 1px solid var(--line);
    border-radius: 18px;
    background: color-mix(in srgb, var(--sky-low) 70%, transparent);
  }
  .card p { margin: 0 0 .75rem; color: var(--muted); }
  .card .more { margin: 0; font-size: 1rem; }
  h2 {
    font-family: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
    font-weight: 600;
    font-size: 1.05rem;
    letter-spacing: -.01em;
    color: var(--muted);
    margin: 0 0 1rem;
    padding-bottom: .75rem;
    border-bottom: 1px solid var(--line);
  }
  h3 {
    font-family: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
    font-variation-settings: "opsz" 48;
    font-weight: 700;
    font-size: 2rem;
    letter-spacing: -.03em;
    line-height: 1.1;
    margin: 0 0 .5rem;
  }
  .links { display: flex; gap: 1.5rem; flex-wrap: wrap; margin: 0; padding: 0; list-style: none; }

  a {
    color: var(--text);
    text-decoration-line: underline;
    text-decoration-color: var(--accent);
    text-decoration-thickness: 2px;
    text-underline-offset: 5px;
    transition: text-decoration-thickness .15s ease, color .15s ease;
  }
  a:hover { color: var(--accent); text-decoration-thickness: 3px; }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 2px; }
  h3 a { text-decoration: none; }

  @media (max-width: 760px) {
    .hero { grid-template-columns: 1fr; padding-top: 2.5rem; min-height: 0; gap: 0; }
    .stage { order: -1; max-width: 30rem; justify-self: center; }
    main { grid-template-columns: 1fr; }
    .bio { max-width: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    #scene { transition: none; }
    a { transition: none; }
  }
</style>
</head>
<body>
<header class="hero">
  <div class="intro">
    <h1>Ivan</h1>
    <p class="bio">Mobile dev. Building small things in my spare time.</p>
    <ul class="links social" aria-label="Find me">
      <li><a href="https://github.com/IvanWng97">GitHub</a></li>
    </ul>
  </div>
  <div class="stage">
    <canvas id="scene" aria-hidden="true"></canvas>
    <img class="fallback" src="/room.jpg" width="1200" height="1200" alt="A cartoon of Ivan on a sofa with his laptop: a floor lamp, a bookshelf with a camera, a turntable playing by the balcony door, headphones on the sofa arm, a sunset print on the wall, and his road bike on a stand.">
    <noscript><style>#scene { display: none; } .fallback { display: block; }</style></noscript>
  </div>
</header>

<main>
  <section class="projects" aria-labelledby="projects">
    <h2 id="projects">Projects</h2>
    <ul class="cards">
      <li class="card">
        <h3><a href="https://pixtuoid.dev">pixtuoid</a></h3>
        <p>Your AI coding agents, visualized as pixel-art coworkers in a terminal office.</p>
        <p class="more"><a href="https://github.com/pixtuoid/pixtuoid">Source on GitHub</a></p>
      </li>
    </ul>
  </section>
</main>
